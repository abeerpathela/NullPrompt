<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NullPrompt</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <header>
        <img src="../icons/icon48.png" class="logo" alt="NullPrompt">
        <h1>NullPrompt</h1>
        <div class="status">
            <span class="status-dot"></span>
            <span>Active</span>
        </div>
    </header>

    <div id="findings-list" class="findings-container">
        <div class="no-findings">
            <div class="no-findings-icon">🛡️</div>
            No sensitive data detected
        </div>
    </div>

    <div class="info-text">
        NullPrompt protects your data before it's sent to AI platforms
    </div>
    <script src="popup.js"></script>
</body>
</html>
